pluginManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def localConfig = new Properties()
        def localConfigFile = file("local.properties")
        if (localConfigFile.exists()) {
            localConfigFile.withInputStream { input ->
                localConfig.load(input)
            }
        }
        // 提交默认值放在 gradle.properties；本机 Android Studio Run 可用 local.properties 覆盖。
        def useLocalSdkRepoValue = gradle.startParameter.projectProperties.get("useLocalSdkRepo")
        if (useLocalSdkRepoValue == null) {
            useLocalSdkRepoValue = localConfig.getProperty("useLocalSdkRepo")
        }
        if (useLocalSdkRepoValue == null) {
            useLocalSdkRepoValue = providers.gradleProperty("useLocalSdkRepo").orElse("false").get()
        }
        def useLocalSdkRepo = useLocalSdkRepoValue.toBoolean()
        exclusiveContent {
            forRepository {
                if (useLocalSdkRepo) {
                    maven { url = uri("local-sdk-repo") }
                } else {
                    maven { url = uri("https://repo.maven.apache.org/maven2") }
                }
            }
            filter {
                includeGroup("vip.xiaoweisoul.sdk")
            }
        }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}

rootProject.name = "xiaowei-sdk-android-demo"
include(":app")
